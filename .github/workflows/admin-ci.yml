
name: Admin Dashboard CI

on:
  push:
    branches:
      - develop
    paths:
      - 'Admin Dashboard/**'
      - '.github/workflows/admin-ci.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'Admin Dashboard/**'
      - '.github/workflows/admin-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-checks:
    name: React Build and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Admin Dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'Admin Dashboard/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React application
        run: npm run build
