name: Mobile CI

on:
  push:
    branches:
      - develop
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-checks:
    name: Flutter Analysis and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test
